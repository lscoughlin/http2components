# The build driver. The minimum go-task version is 3.42.0. The files use
# `requires`, `for`, and `includes` with `flatten`. The installed version
# when this file was written is 3.54.0.
version: '3'

includes:
  pins:
    taskfile: ./tools/dependencies.yml
    flatten: true
  deps:
    taskfile: ./taskfiles/deps.yml
    flatten: true
    dir: '{{.ROOT_DIR}}'
  build:
    taskfile: ./taskfiles/build.yml
    flatten: true
    dir: '{{.ROOT_DIR}}'
  test:
    taskfile: ./taskfiles/test.yml
    flatten: true
    dir: '{{.ROOT_DIR}}'
  validate:
    taskfile: ./taskfiles/validate.yml
    flatten: true
    dir: '{{.ROOT_DIR}}'
  check:
    taskfile: ./taskfiles/check.yml
    flatten: true
    dir: '{{.ROOT_DIR}}'

# Shared variables. A `sh:` variable is computed when a task that runs uses
# it. `task --list` does not compute it, so a missing fpc does not break
# the listing. Each of FPC, TARGET and PROFILE follows the environment
# variable of the same name, as tools/build.py does.
vars:
  ROOT: '{{.ROOT_DIR}}'
  FPC:
    sh: echo "${FPC:-fpc}"
  # The value is a letter, digit, dot, underscore or dash string. "." and ".."
  # are not valid. The default is <fpc -iTP>-<fpc -iTO>.
  TARGET:
    sh: |
      fpc="${FPC:-fpc}"
      if ! command -v "$fpc" >/dev/null 2>&1; then
        echo "fpc is missing: '$fpc' is not on PATH. Install the Free Pascal compiler or set FPC." >&2
        exit 1
      fi
      t="${TARGET:-$("$fpc" -iTP)-$("$fpc" -iTO)}"
      case "$t" in
        ''|.|..|*[!A-Za-z0-9._-]*)
          echo "TARGET must contain only letters, numbers, dot, underscore, or dash" >&2
          exit 1 ;;
      esac
      echo "$t"
  # PROFILE follows the same rule. The default is debug when DEBUG is not
  # empty, else default.
  PROFILE:
    sh: |
      if [ -n "${PROFILE:-}" ]; then p="$PROFILE"; elif [ -n "${DEBUG:-}" ]; then p=debug; else p=default; fi
      case "$p" in
        .|..|*[!A-Za-z0-9._-]*)
          echo "PROFILE must contain only letters, numbers, dot, underscore, or dash" >&2
          exit 1 ;;
      esac
      echo "$p"
  OUT: '{{.ROOT}}/bin/{{.TARGET}}/{{.PROFILE}}'
