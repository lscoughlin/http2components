version: '3'

# Repository checks. A rule prints "FAIL <text>" for each fault. A task
# exits 1 when it prints at least one FAIL line. The public tasks
# source:check, docs:check and version:check run all of their rules and
# report every fault, not only the first one.
vars:
  # The one license string that the kept rules compare with.
  LICENSE_SPDX: 'Apache-2.0 OR (LGPL-2.1-only WITH Independent-modules-exception)'
  COPYRIGHT_LINE: 'copyright: Copyright 2026 Liam Seamus Coughlin'
  # The current version. The VERSION file and each .lpk file agree with it.
  VERSION_EXPECTED: '0.34.0'
  # The component directories. Each has a src directory and the .lpk files.
  COMPONENT_DIRS: 'common client server tls/openssl tls/tlslib'
  # The directories that hold maintained Pascal files.
  PASCAL_DIRS: 'test examples tools common client server tls/openssl tls/tlslib'

tasks:
  # Builds every Lazarus package with lazbuild, with a private Lazarus
  # configuration for each package. The .lpk files are maintained by hand and
  # are not changed. The packages build in a fixed order: common, OpenSSL, client, server, readers, TlsLib.
  packages:check:
    desc: Build every Lazarus package with lazbuild
    silent: true
    cmds:
      - task: verify-dependencies
      # lazbuild rewrites the package .pas file of each package it builds
      # (the generated unit of the package). The generated files are ignored
      # by git. The .lpk files are maintained by hand, so the task saves them
      # and restores them when it ends, also after a failure.
      - |
        rm -rf '{{.OUT}}/package-backup'
        mkdir -p '{{.OUT}}/package-backup'
        for _f in common/http2common client/http2client client/http2clientreaders \
                  server/http2server tls/openssl/http2openssl tls/tlslib/http2tlslib; do
          mkdir -p "{{.OUT}}/package-backup/${_f%/*}"
          cp -p "$_f.lpk" "{{.OUT}}/package-backup/${_f%/*}/"
        done
      - defer: |
          cd '{{.OUT}}/package-backup' || exit 0
          for _f in */*.lpk tls/*/*.lpk; do
            [ -f "$_f" ] && cp -p "$_f" "{{.ROOT_DIR}}/$_f"
          done
          true
      - |
        {{.BUILD_SH}}
        _lb=${LAZBUILD:-lazbuild}
        if ! command -v "$_lb" >/dev/null 2>&1; then
          echo "lazbuild is required to build the package files" >&2; exit 1
        fi
        for _p in common/http2common.lpk client/http2client.lpk server/http2server.lpk \
                  tls/openssl/http2openssl.lpk client/http2clientreaders.lpk tls/tlslib/http2tlslib.lpk; do
          [ -f "$_p" ] || { echo "Package file is missing: $_p" >&2; exit 1; }
        done
      - task: package-build
        vars: {PACKAGE: http2common}
      - task: package-build
        vars: {PACKAGE: http2openssl}
      - task: package-build
        vars: {PACKAGE: http2client}
      - task: package-build
        vars: {PACKAGE: http2server}
      - task: package-build
        vars: {PACKAGE: http2clientreaders}
      - task: package-build
        vars: {PACKAGE: http2tlslib}

  # Var: PACKAGE, the package name (for example http2client).
  package-build:
    internal: true
    silent: true
    requires:
      vars: [PACKAGE]
    cmds:
      # The TlsLib package starts from a fresh, ordered bootstrap.
      - cmd: rm -rf '{{.OUT}}/tlslib'
        platforms: [linux, darwin]
        ignore_error: false
        if: '[ "{{.PACKAGE}}" = http2tlslib ]'
      - task: component:build:tlslib
        if: '[ "{{.PACKAGE}}" = http2tlslib ]'
      - |
        {{.BUILD_SH}}
        _pkg='{{.PACKAGE}}'
        _lb=${LAZBUILD:-lazbuild}
        case $_pkg in
          http2common) _comp=common; _lpk=common/http2common.lpk; _links= ;;
          http2openssl) _comp=openssl; _lpk=tls/openssl/http2openssl.lpk; _links=common/http2common.lpk ;;
          http2client) _comp=client; _lpk=client/http2client.lpk; _links=common/http2common.lpk ;;
          http2server) _comp=server; _lpk=server/http2server.lpk; _links=common/http2common.lpk ;;
          http2clientreaders) _comp=readers; _lpk=client/http2clientreaders.lpk
            _links="common/http2common.lpk client/http2client.lpk" ;;
          http2tlslib) _comp=tlslib; _lpk=tls/tlslib/http2tlslib.lpk
            _links="common/http2common.lpk $(dependency_root HashLib4Pascal HASHLIB4PASCAL)/HashLib/src/Packages/FPC/HashLib4PascalPackage.lpk $(dependency_root SimpleBaseLib4Pascal SIMPLEBASELIB4PASCAL)/SimpleBaseLib/src/Packages/FPC/SimpleBaseLib4PascalPackage.lpk $(dependency_root CryptoLib4Pascal CRYPTOLIB4PASCAL)/CryptoLib/src/Packages/FPC/CryptoLib4PascalPackage.lpk $(dependency_root TlsLib4Pascal TLSLIB4PASCAL)/TlsLib/src/Packages/FPC/TlsLib4PascalPackage.lpk" ;;
          *) echo "Unknown package: $_pkg" >&2; exit 1 ;;
        esac
        _cpu=$("$FPC_BIN" -iTP); _os=$("$FPC_BIN" -iTO)
        case $(printf '%s' "$_cpu" | tr 'A-Z' 'a-z') in
          aarch64) _cid=ppca64 ;;
          x86_64) _cid=ppcx64 ;;
          i386) _cid=ppc386 ;;
          arm) _cid=ppcarm ;;
          *) echo "No Lazarus compiler ID is configured for CPU $_cpu" >&2; exit 1 ;;
        esac
        _pcp=$OUT/lazarus-config/$_pkg
        mkdir -p "$_pcp"
        _punits=$OUT/package-$_pkg/units; _pprog=$OUT/package-$_pkg/programs
        rm -rf "$OUT/package-$_pkg"
        mkdir -p "$_punits" "$_pprog"
        # base_flags of the component without the common build units, the
        # package units of the required packages after the first flag, then
        # the package output directories.
        _all=$OUT/package-$_pkg.flags
        compose_flags "$_comp" false 1 | grep -v -e '^#' -e '^$' | grep -vxF -e "-Fu$OUT/common/units" > "$_all.base"
        {
          sed -n 1p "$_all.base"
          if [ "$_comp" != common ]; then printf '%s\n' "-Fu$OUT/package-http2common/units"; fi
          if [ "$_comp" = readers ]; then printf '%s\n' "-Fu$OUT/package-http2client/units"; fi
          sed 1d "$_all.base" | grep -v -e '^-FU' -e '^-FE'
          printf '%s\n' "-FU$_punits" "-FE$_pprog"
        } > "$_all"
        rm -f "$_all.base"
        for _l in $_links; do dep_run "$_lb" "--pcp=$_pcp" --add-package-link "$_l" || exit 1; done
        set -- "--pcp=$_pcp" "--cpu=$_cpu" "--os=$_os" "--compiler=$_cid"
        if [ "$_comp" = tlslib ]; then
          _real=$(command -v "$_cid") || { echo "Cannot resolve Lazarus compiler $_cid" >&2; exit 1; }
          LAZBUILD_REAL_COMPILER=$_real; export LAZBUILD_REAL_COMPILER
          shift 4
          set -- "--pcp=$_pcp" "--cpu=$_cpu" "--os=$_os" "--compiler=$DEP_ROOT/tools/fpc/lazbuild-compiler.sh"
        fi
        while IFS= read -r _f; do set -- "$@" "--opt=$_f"; done < "$_all"
        set -- "$@" "$_lpk"
        case $_comp in
          client|server|readers|openssl) open_ssl_env ;;
        esac
        dep_run "$_lb" "$@"

  source:check:
    desc: Check Pascal headers, sizes, names, and dependencies
    silent: true
    cmds:
      - |
        rc=0
        for t in check:pascal-headers check:file-length check:packages-files check:placeholder-license; do
          {{.TASK_EXE}} --silent "$t" || rc=1
        done
        if [ "$rc" -ne 0 ]; then echo "source:check failed"; fi
        exit "$rc"

  docs:check:
    desc: Check documentation rules, links, index, and YAML
    silent: true
    cmds:
      - |
        rc=0
        for t in check:doc-headers check:doc-index; do
          {{.TASK_EXE}} --silent "$t" || rc=1
        done
        if [ "$rc" -ne 0 ]; then echo "docs:check failed"; fi
        exit "$rc"

  version:check:
    desc: Check current version agreement
    silent: true
    cmds:
      - |
        rc=0
        for t in check:version-file check:package-versions; do
          {{.TASK_EXE}} --silent "$t" || rc=1
        done
        if [ "$rc" -ne 0 ]; then echo "version:check failed"; fi
        exit "$rc"

  # R01, R02.
  check:version-file:
    silent: true
    cmds:
      - |
        out=$(
          if [ ! -f VERSION ]; then
            echo "FAIL VERSION is missing"
          elif ! printf '%s\n' '{{.VERSION_EXPECTED}}' | cmp -s - VERSION; then
            echo "FAIL VERSION must contain exactly {{.VERSION_EXPECTED}} followed by one newline"
          fi
        )
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

  # R04. The Version element of each .lpk equals the expected version.
  check:package-versions:
    silent: true
    cmds:
      - |
        v='{{.VERSION_EXPECTED}}'
        major=${v%%.*}
        rest=${v#*.}
        minor=${rest%%.*}
        release=${rest#*.}
        out=$(
          for d in {{.COMPONENT_DIRS}}; do
            for f in "$d"/*.lpk; do
              [ -f "$f" ] || continue
              if ! grep -q "<Version Major=\"$major\" Minor=\"$minor\" Release=\"$release\" Build=\"0\" />" "$f"; then
                found=$(grep '<Version Major=' "$f" | head -n 1 | sed 's/^[^"]*"\([^"]*\)"[^"]*"\([^"]*\)"[^"]*"\([^"]*\)".*/\1.\2.\3/')
                echo "FAIL $f declares version ${found:-none}; expected $v"
              fi
            done
          done
        )
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

  # R06, R07, R08. At least one Pascal file exists. A Pascal or include
  # file has fewer than 1000 lines. awk counts a last line without a
  # newline.
  check:file-length:
    silent: true
    cmds:
      - |
        list=$( { find {{.PASCAL_DIRS}} -name '*.pas'; find . -maxdepth 1 -name '*.pas' | sed 's|^\./||'; find doc/verification/client-probes -maxdepth 1 -name '*.pas' 2>/dev/null; find {{.COMPONENT_DIRS}} -name '*.inc'; } | LC_ALL=C sort -u )
        out=$(
          if ! find {{.PASCAL_DIRS}} -name '*.pas' | grep -q .; then
            echo "FAIL no maintained Pascal files exist"
          fi
          printf '%s\n' "$list" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            awk -v f="$f" 'END{if(NR>=1000)print "FAIL " f " has " NR " lines; the maximum is 999"}' "$f"
          done
        )
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

  # R05, R43, R48, R52, R53, R54, R56, R57.
  check:packages-files:
    silent: true
    cmds:
      - |
        t=$(mktemp -d)
        out=$(
          for d in {{.COMPONENT_DIRS}}; do
            if [ ! -d "$d/src" ]; then
              case "$d" in
                tls/*)
                  ls "$d"/*.lpk >/dev/null 2>&1 || continue ;;
              esac
              echo "FAIL Required component source directory is missing: $d/src"
            fi
          done
          if [ ! -f http2components.lpg ]; then echo "FAIL http2components.lpg is missing"; fi
          for p in common/http2common client/http2client client/http2clientreaders server/http2server tls/openssl/http2openssl tls/tlslib/http2tlslib; do
            if [ ! -f "$p.lpk" ]; then echo "FAIL required package ${p##*/}.lpk is missing"; fi
          done
          for d in {{.COMPONENT_DIRS}}; do
            for f in "$d"/*.lpk; do
              [ -f "$f" ] || continue
              pkg=$(basename "$f" .lpk)
              if ! grep -qF '<License Value="{{.LICENSE_SPDX}}"' "$f"; then
                echo "FAIL $pkg does not declare the approved dual license"
              fi
              if ! grep -qE 'UnitOutputDirectory Value="(\.\./)+bin/' "$f"; then
                echo "FAIL $pkg must write compiler units under bin/"
              fi
              awk -v p="$pkg" '
                /<Files Count=/ { match($0, /Count="[0-9]+"/); n = substr($0, RSTART + 7, RLENGTH - 8) }
                /<Filename/ { m++ }
                END { if (n + 0 != m + 0) printf "FAIL %s lists %d files but has %d entries\n", p, n, m }' "$f"
            done
          done
          if grep -qi 'OtherUnitFiles.*mormot' common/http2common.lpk 2>/dev/null; then
            echo "FAIL http2common.lpk must not depend on mORMot2"
          fi
          for d in {{.COMPONENT_DIRS}}; do
            [ -d "$d/src" ] || continue
            (cd "$d" && find src -name '*.pas' | LC_ALL=C sort) > "$t/src"
            cat "$d"/*.lpk 2>/dev/null | grep '<Filename' | sed 's/.*Value="\([^"]*\)".*/\1/' | LC_ALL=C sort > "$t/lpk"
            LC_ALL=C comm -23 "$t/src" "$t/lpk" | while IFS= read -r n; do
              echo "FAIL $d/$n is not listed in a package file of $d"
            done
            LC_ALL=C comm -13 "$t/src" "$t/lpk" | while IFS= read -r n; do
              echo "FAIL $d/$n is listed in a package file but is not in $d/src"
            done
          done
        )
        rm -rf "$t"
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

  # D03. The placeholder license is absent.
  check:placeholder-license:
    silent: true
    cmds:
      - |
        if grep -rIl 'TBD-LICENCE' test examples doc tools NOTICE LICENSE README.md Taskfile.yaml 2>/dev/null | grep -q .; then
          echo "FAIL the placeholder licence is still present"
          exit 1
        fi

  # Y07 to Y11. Pascal header shape, license line, copyright line.
  check:pascal-headers:
    silent: true
    cmds:
      - |
        list=$( { find {{.PASCAL_DIRS}} -name '*.pas'; find . -maxdepth 1 -name '*.pas' | sed 's|^\./||'; find doc/verification/client-probes -maxdepth 1 -name '*.pas' 2>/dev/null; find {{.COMPONENT_DIRS}} -name '*.inc'; } | LC_ALL=C sort -u )
        # The package units are generated by lazbuild and ignored by git.
        list=$(printf '%s\n' "$list" | grep -vxF -e common/http2common.pas -e client/http2client.pas -e client/http2clientreaders.pas -e server/http2server.pas -e tls/openssl/http2openssl.pas -e tls/tlslib/http2tlslib.pas)
        out=$(
          printf '%s\n' "$list" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            awk -v f="$f" -v lic='license: {{.LICENSE_SPDX}}' -v cp='{{.COPYRIGHT_LINE}}' '
              NR == 1 { l1 = $0 }
              NR == 2 { l2 = $0 }
              NR == 3 { l3 = $0 }
              NR > 2 && cl == 0 && $0 == "---" { cl = NR; next }
              NR > 2 && cl == 0 && $0 == cp { hascp = 1 }
              cl > 0 && NR == cl + 1 { after = $0 }
              END {
                if (l1 != "{**" || l2 != "---" || cl == 0 || after != "}") {
                  print "FAIL " f ": pasdoc YAML header must start on line 1 and close without a blank line"
                } else {
                  if (l3 != lic) {
                    print "FAIL " f ": license must follow the opening front matter line"
                    print "FAIL " f ": license value is not the approved SPDX expression"
                  }
                  if (!hascp) print "FAIL " f ": copyright value is missing or incorrect"
                }
              }' "$f"
          done
        )
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

  # Y01, Y02, Y03, Y05, Y06. Document front matter.
  check:doc-headers:
    silent: true
    cmds:
      - |
        out=$(
          find doc -name '*.md' | LC_ALL=C sort | while IFS= read -r f; do
            awk -v f="$f" -v lic='license: {{.LICENSE_SPDX}}' -v cp='{{.COPYRIGHT_LINE}}' '
              NR == 1 { l1 = $0 }
              NR == 2 { l2 = $0 }
              NR > 1 && cl == 0 && $0 == "---" { cl = NR; next }
              NR > 1 && cl == 0 && $0 == cp { hascp = 1 }
              END {
                if (l1 != "---") {
                  print "FAIL " f ": front matter must start on line 1"
                } else if (cl == 0) {
                  print "FAIL " f ": closing front matter line is missing"
                } else {
                  if (l2 != lic) {
                    print "FAIL " f ": license must be on line 2"
                    print "FAIL " f ": license value is not the approved SPDX expression"
                  }
                  if (!hascp) print "FAIL " f ": copyright value is missing or incorrect"
                }
              }' "$f"
          done
        )
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi

  # R36, R37, R38, R40. Document set, index, and forbidden references.
  check:doc-index:
    silent: true
    cmds:
      - |
        out=$(
          if ! find doc -name '*.md' | grep -q .; then
            echo "FAIL doc/ has no Markdown documents"
          fi
          if [ ! -f doc/README.md ]; then
            echo "FAIL doc/README.md is missing; the document index is required"
          fi
          grep -rliE '(^|[^[:alnum:]_])(plan/|story([^[:alnum:]_]|$))|\.ai/' doc --include='*.md' | LC_ALL=C sort | while IFS= read -r f; do
            echo "FAIL $f refers to plan/, .ai/, or a story"
          done
          if [ -f doc/README.md ]; then
            find doc -name '*.md' | LC_ALL=C sort | while IFS= read -r f; do
              case "$f" in doc/README.md|doc/references/README.md) continue ;; esac
              if ! grep -qF "${f#doc/}" doc/README.md; then
                echo "FAIL $f is not listed in doc/README.md"
              fi
            done
          fi
        )
        if [ -n "$out" ]; then printf '%s\n' "$out"; exit 1; fi
